name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      - name: Install release-era build tooling
        run: |
          python -m pip install --index-url 'https://:2017-05-10T14%3A05%3A39.911571Z@time-machines-pypi.sealsecurity.io/' 'setuptools==35.0.2' 'wheel==0.29.0'
          python -c "import setuptools, wheel; print(setuptools.__version__, wheel.__version__)"

      - name: Build sdist and universal wheel
        run: |
          python setup.py sdist
          python setup.py bdist_wheel --universal
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
